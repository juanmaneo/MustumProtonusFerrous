[package]
name = "mpf-conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Conformance harness: runs MPF API cases derived from wine's dlls/*/tests expectations"

[dependencies]
mpf-advapi32 = { path = "../mpf-advapi32" }
mpf-kernel32 = { path = "../mpf-kernel32" }
mpf-loader = { path = "../mpf-loader" }
mpf-msvcrt = { path = "../mpf-msvcrt" }
mpf-ole32 = { path = "../mpf-ole32" }
mpf-oleaut32 = { path = "../mpf-oleaut32" }
mpf-ntdll = { path = "../mpf-ntdll" }
mpf-pe = { path = "../mpf-pe" }
mpf-rpcrt4 = { path = "../mpf-rpcrt4" }
mpf-shlwapi = { path = "../mpf-shlwapi" }
mpf-shell32 = { path = "../mpf-shell32" }
mpf-wineboot = { path = "../mpf-wineboot" }
mpf-winnt = { path = "../mpf-winnt" }
